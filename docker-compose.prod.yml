version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pupbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pupbox_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pupbox_net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pupbox_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pupbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pupbox_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    volumes:
      # Images uploaded in admin (logo, photos) must outlive rebuilds.
      - uploads:/app/apps/api/public/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - pupbox_net
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Next.js bakes NEXT_PUBLIC_* into the build; without these the live
      # site would call localhost. Values come from .env.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: always
    env_file: .env
    depends_on:
      - api
    networks:
      - pupbox_net
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    env_file: .env
    depends_on:
      - api
    networks:
      - pupbox_net
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  pupbox_net:
    driver: bridge
