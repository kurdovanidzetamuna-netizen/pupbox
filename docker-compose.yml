version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pupbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pupbox
      POSTGRES_PASSWORD: pupbox_secret
      POSTGRES_DB: pupbox_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pupbox -d pupbox_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pupbox_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
